<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
{{robots}}
<link rel="canonical" href="{{canonical}}">
<meta property="og:site_name" content="NeuroAIQ">
<meta property="og:locale" content="en_AU">
<meta property="og:type" content="{{og_type}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{og_image}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#003466">
<link rel="icon" type="image/png" href="{{root}}assets/img/favicon.png">
<link rel="apple-touch-icon" href="{{root}}assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;display=swap">
<link rel="stylesheet" href="{{root}}assets/css/site.css">
<script>
(function (d) {
  d.classList.add('js');
  if ('IntersectionObserver' in window && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    d.classList.add('js-motion');
    setTimeout(function () { if (!window.__nqReady) d.classList.remove('js-motion'); }, 2500);
  }
})(document.documentElement);
</script>
{{head_extra}}
</head>
<body class="{{page_class}}">
<a class="skip" href="#main">Skip to content</a>
{{> header}}
<main id="main">
{{body}}
</main>
<!-- if footer_full -->{{> footer-full}}<!-- endif footer_full -->
<!-- if not footer_full -->{{> footer-compact}}<!-- endif footer_full -->
<script src="{{root}}assets/js/site.js" defer></script>
{{scripts_extra}}
</body>
</html>
