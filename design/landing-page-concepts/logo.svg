    <g transform="translate(6,0)">
      <path class="outer-glow-path" filter="url(#outerGlow)" d="M0.0,597.0 C4.7,608.3 6.8,620.8 14.0,631.0 C21.2,641.2 32.8,651.5 43.0,658.0 C53.2,664.5 63.3,667.8 75.0,670.0 C86.7,672.2 102.3,672.0 113.0,671.0 C123.7,670.0 130.0,668.2 139.0,664.0 C148.0,659.8 159.8,652.2 167.0,646.0 C174.2,639.8 177.7,635.7 182.0,627.0 C186.3,618.3 184.0,600.7 193.0,594.0 C202.0,587.3 222.3,593.2 236.0,587.0 C249.7,580.8 265.3,569.2 275.0,557.0 C284.7,544.8 291.5,529.5 294.0,514.0 C296.5,498.5 286.8,474.5 290.0,464.0 C293.2,453.5 306.0,456.8 313.0,451.0 C320.0,445.2 326.7,441.7 332.0,429.0 C337.3,416.3 344.5,389.8 345.0,375.0 C345.5,360.2 340.3,350.0 335.0,340.0 C329.7,330.0 315.0,325.2 313.0,315.0 C311.0,304.8 322.3,291.7 323.0,279.0 C323.7,266.3 322.2,251.5 317.0,239.0 C311.8,226.5 300.5,212.3 292.0,204.0 C283.5,195.7 270.2,198.8 266.0,189.0 C261.8,179.2 269.8,159.0 267.0,145.0 C264.2,131.0 256.7,115.8 249.0,105.0 C241.3,94.2 234.0,86.5 221.0,80.0 C208.0,73.5 181.3,72.7 171.0,66.0 C160.7,59.3 165.5,48.7 159.0,40.0 C152.5,31.3 141.7,20.3 132.0,14.0 C122.3,7.7 110.2,4.2 101.0,2.0 C91.8,-0.2 89.2,-2.0 77.0,1.0 C64.8,4.0 39.2,13.3 28.0,20.0 C16.8,26.7 14.7,32.5 10.0,41.0 C5.3,49.5 3.3,61.0 0.0,71.0 Z"/>
    </g>
  </g>

